<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperium Academy | Student Portal</title>
</head>
<body>
  <h1>IMPERIUM ACADEMY</h1>
  <h2>Student Portal</h2>

  <p>Register as an Imperium Academy student.</p>

  <form>
    <input type="text" placeholder="Full Name" required><br><br>
    <input type="email" placeholder="Email Address" required><br><br>
    <input type="tel" placeholder="Phone Number" required><br><br>

    <select required>
      <option value="">Select Programme</option>
      <option>WAEC</option>
      <option>JAMB</option>
      <option>NECO</option>
      <option>POST-UTME</option>
      <option>JUPEB</option>
    </select><br><br>

    <button type="submit">Create Student Account</button>
  </form>
</body>
</html>
