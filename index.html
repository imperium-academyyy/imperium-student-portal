<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imperium Academy - Student Registration</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      color: #123c69;
      font-size: 28px;
      margin-bottom: 8px;
    }

    .header p {
      color: #666;
      font-size: 14px;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
      color: #333;
    }

    input, select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus, select:focus {
      border-color: #123c69;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      background: #123c69;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .secondary {
      background: #777;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }

    .success {
      background: #e8f7ed;
      color: #18733a;
    }

    .error {
      background: #fdeaea;
      color: #b42318;
    }

    .otp-box {
      margin-top: 20px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header">
    <h1>IMPERIUM ACADEMY</h1>
    <p>Student Registration Portal</p>
  </div>

  <!-- REGISTRATION FORM -->
  <div id="registrationSection">

    <form id="registrationForm">

      <label>Full Name</label>
      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >

      <label>Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label>Phone Number</label>
      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
        required
      >

      <label>Programme</label>
      <select id="programme" required>
        <option value="">Select programme</option>
        <option value="JAMB">JAMB</option>
        <option value="WAEC">WAEC</option>
        <option value="NECO">NECO</option>
        <option value="POST-UTME">POST-UTME</option>
        <option value="JUPEB">JUPEB</option>
      </select>

      <button type="submit">
        Send OTP
      </button>

    </form>

    <div id="message"></div>

  </div>


  <!-- OTP SECTION -->
  <div id="otpSection" class="hidden">

    <div class="otp-box">

      <h3 style="text-align:center; color:#123c69;">
        Verify Your Email
      </h3>

      <p style="text-align:center; margin-top:10px; color:#666;">
        Enter the OTP sent to your email address.
      </p>

      <label>OTP Code</label>

      <input
        type="text"
        id="otp"
        placeholder="Enter 6-digit OTP"
        maxlength="6"
        inputmode="numeric"
      >

      <button id="verifyBtn">
        Verify OTP & Complete Registration
      </button>

      <button id="resendBtn" class="secondary">
        Resend OTP
      </button>

      <button id="changeEmailBtn" class="secondary">
        Change Email
      </button>

      <div id="otpMessage"></div>

    </div>

  </div>

</div>


<script>

  // ==========================================
  // SUPABASE CONNECTION
  // ==========================================

  const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";

  const SUPABASE_KEY = "YOUR_SUPABASE_PUBLISHABLE_KEY";

  const db = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


  // ==========================================
  // VARIABLES
  // ==========================================

  let registrationData = {
    fullName: "",
    email: "",
    phone: "",
    programme: ""
  };


  // ==========================================
  // ELEMENTS
  // ==========================================

  const registrationForm =
    document.getElementById("registrationForm");

  const registrationSection =
    document.getElementById("registrationSection");

  const otpSection =
    document.getElementById("otpSection");

  const message =
    document.getElementById("message");

  const otpMessage =
    document.getElementById("otpMessage");


  // ==========================================
  // SEND OTP
  // ==========================================

  registrationForm.addEventListener("submit", async function(e) {

    e.preventDefault();

    message.innerHTML = "";

    registrationData.fullName =
      document.getElementById("fullName").value.trim();

    registrationData.email =
      document.getElementById("email").value.trim();

    registrationData.phone =
      document.getElementById("phone").value.trim();

    registrationData.programme =
      document.getElementById("programme").value;


    const { error } = await db.auth.signInWithOtp({

      email: registrationData.email,

      options: {
        shouldCreateUser: true
      }

    });


    if (error) {

      message.className = "message error";

      message.textContent =
        "Unable to send OTP: " + error.message;

      return;
    }


    message.className = "message success";

    message.textContent =
      "OTP sent. Check your email.";


    registrationSection.classList.add("hidden");

    otpSection.classList.remove("hidden");

  });


  // ==========================================
  // VERIFY OTP
  // ==========================================

  document
    .getElementById("verifyBtn")
    .addEventListener("click", async function() {

      otpMessage.innerHTML = "";

      const otp =
        document.getElementById("otp").value.trim();


      if (!otp) {

        otpMessage.className = "message error";

        otpMessage.textContent =
          "Please enter the OTP.";

        return;
      }


      const { data, error } =
        await db.auth.verifyOtp({

          email: registrationData.email,

          token: otp,

          type: "email"

        });


      if (error) {

        otpMessage.className = "message error";

        otpMessage.textContent =
          "Invalid or expired OTP: " + error.message;

        return;
      }


      // ========================================
      // IMPORTANT:
      // GET AUTHENTICATED USER AFTER OTP
      // ========================================

      const user = data.user;


      if (!user) {

        otpMessage.className = "message error";

        otpMessage.textContent =
          "Verification succeeded, but no user session was created.";

        return;
      }


      // ========================================
      // INSERT STUDENT PROFILE
      // ========================================

      const { error: insertError } =
        await db
          .from("students")
          .insert([{

            user_id: user.id,

            full_name: registrationData.fullName,

            email: registrationData.email,

            phone: registrationData.phone,

            programme: registrationData.programme

          }]);


      if (insertError) {

        otpMessage.className = "message error";

        otpMessage.textContent =
          "Registration failed: " + insertError.message;

        return;
      }


      // ========================================
      // SUCCESS
      // ========================================

      otpMessage.className = "message success";

      otpMessage.textContent =
        "Registration successful! Welcome to Imperium Academy.";


      document
        .getElementById("verifyBtn")
        .disabled = true;

    });


  // ==========================================
  // RESEND OTP
  // ==========================================

  document
    .getElementById("resendBtn")
    .addEventListener("click", async function() {

      otpMessage.innerHTML = "";

      const { error } =
        await db.auth.signInWithOtp({

          email: registrationData.email,

          options: {
            shouldCreateUser: true
          }

        });


      if (error) {

        otpMessage.className = "message error";

        otpMessage.textContent =
          "Unable to resend OTP: " + error.message;

        return;
      }


      otpMessage.className = "message success";

      otpMessage.textContent =
        "A new OTP has been sent.";

    });


  // ==========================================
  // CHANGE EMAIL
  // ==========================================

  document
    .getElementById("changeEmailBtn")
    .addEventListener("click", function() {

      otpSection.classList.add("hidden");

      registrationSection.classList.remove("hidden");

      document.getElementById("otp").value = "";

    });

</script>

</body>
</html>
